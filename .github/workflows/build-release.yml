name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SIGNING_ENABLED: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version
        run: |
          $version = [IO.File]::ReadAllText('VERSION').Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag must match VERSION'
          }
      - name: Download pinned dependencies
        run: ./source/setup-deps.ps1
      - name: Compile EXE and icons
        run: ./source/build.ps1
      - name: Check EXE version and UI
        run: ./source/check-build.ps1
      - name: Check library and embedded playback without GPU
        run: ./source/check-library.ps1
      - name: Check replay buffer reset without GPU
        run: ./source/check-buffer.ps1
      - name: Check audio disconnect and recovery without devices
        run: ./source/check-audio.ps1
      - name: Check desktop capture recovery without GPU
        run: ./source/check-capture-recovery.ps1
      - name: Validate configured signing
        if: env.SIGNING_ENABLED == 'true'
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_APP: ${{ vars.SIGNPATH_APP_CONFIGURATION }}
          SIGNPATH_SETUP: ${{ vars.SIGNPATH_SETUP_CONFIGURATION }}
        run: |
          foreach ($name in @('SIGNPATH_API_TOKEN','SIGNPATH_PROJECT','SIGNPATH_POLICY','SIGNPATH_APP','SIGNPATH_SETUP')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing signing configuration: $name" }
          }
      - name: Upload application for signing
        if: env.SIGNING_ENABLED == 'true'
        id: app-signing-input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ReplayLite-application-signing
          path: |
            ReplayLite.exe
            UpdateHelper.exe
            Uninstall.exe
          archive: true
          if-no-files-found: error
          retention-days: 1
      - name: Sign application and helpers
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_CONFIGURATION }}
          github-artifact-id: ${{ steps.app-signing-input.outputs.artifact-id }}
          output-artifact-directory: .signed/application
      - name: Verify signed application
        if: env.SIGNING_ENABLED == 'true'
        run: ./source/import-signed-files.ps1 -InputDirectory .signed/application -TargetDirectory . -Names @('ReplayLite.exe','UpdateHelper.exe','Uninstall.exe')
      - name: Package portable application and setup
        run: ./source/package.ps1
      - name: Upload setup for signing
        if: env.SIGNING_ENABLED == 'true'
        id: setup-signing-input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ReplayLite-setup-signing
          path: dist/ReplayLite-Setup.exe
          archive: true
          if-no-files-found: error
          retention-days: 1
      - name: Sign installer
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_CONFIGURATION }}
          github-artifact-id: ${{ steps.setup-signing-input.outputs.artifact-id }}
          output-artifact-directory: .signed/setup
      - name: Verify signed setup and recalculate checksums
        if: env.SIGNING_ENABLED == 'true'
        run: |
          ./source/import-signed-files.ps1 -InputDirectory .signed/setup -TargetDirectory dist -Names @('ReplayLite-Setup.exe')
          ./source/package-checksums.ps1
      - name: Check installation and update rollback
        run: ./source/check-deployment.ps1
      - name: Check native installer in both modes
        run: ./source/check-installer.ps1
      - name: Upload build files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ReplayLite-Windows
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          archive: true
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ReplayLite-Windows
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/ReplayLite.exe dist/ReplayLite-Portable.zip dist/ReplayLite-Setup.exe dist/SHA256SUMS.txt \
            --verify-tag --draft --title "ReplayLite $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE-NOTES.md
          gh release edit "$GITHUB_REF_NAME" --draft=false
